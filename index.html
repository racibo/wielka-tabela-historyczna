<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wielka tabela historyczna</title><meta name="description" content="Interaktywny diagram historyczny"><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><div><h1>Wielka tabela historyczna</h1><p class="subtitle">Państwa, władcy i osoby sprawujące władzę na wspólnej osi czasu</p></div><div class="toolbar"><button id="addCountryBtn" class="primary">＋ Państwo</button><button id="addRulerBtn">＋ Władca</button><button id="fitBtn">Dopasuj</button><button id="zoomOutBtn">−</button><button id="zoomInBtn">＋</button><button id="settingsBtn">⚙</button><button id="saveSheetBtn">Zapisz GOV</button></div></header>
<section class="controls"><div><label>Widok</label><select id="rangeSelect"><option value="auto">Automatyczny zakres</option><option value="100">Ostatnie 100 lat</option><option value="250">Ostatnie 250 lat</option><option value="500">Ostatnie 500 lat</option><option value="1000">Ostatnie 1000 lat</option><option value="2000">Ostatnie 2000 lat</option></select></div><div><label>Skala</label><span id="scaleLabel"></span></div><div><label>Państwa</label><span id="countryCount"></span></div><div><label>Osoby</label><span id="rulerCount"></span></div></section>
<main id="diagramViewport" class="diagram-viewport"><div id="diagram" class="diagram"></div></main>
<aside id="detailsPanel" class="details hidden"><button class="close" id="closeDetails">×</button><div id="detailsContent"></div></aside>
<dialog id="countryDialog"><form method="dialog" id="countryForm"><h2>Dodaj państwo</h2><label>Nazwa państwa<input id="countryName" required placeholder="np. Portugalia"></label><label>Skrót<input id="countryCode" maxlength="8" placeholder="np. PT"></label><div class="dialog-actions"><button value="cancel">Anuluj</button><button id="saveCountryBtn" class="primary" value="default">Dodaj</button></div></form></dialog>
<dialog id="rulerDialog"><form method="dialog" id="rulerForm"><h2>Dodaj władcę / osobę sprawującą władzę</h2><label>Państwo<select id="rulerCountry" required></select></label><label>Imię i nazwisko<input id="rulerName" required placeholder="np. Jan Kowalski"></label><label>Funkcja / rola<input id="rulerRole" placeholder="np. premier"></label><label>Poziom władzy<select id="rulerLevel"><option value="1">1 — najwyższy</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label><div class="date-grid"><label>Od<input id="rulerStart" required placeholder="2015, 03/2015 lub 12/03/2015"></label><label>Do<input id="rulerEnd" placeholder="puste = dziś"></label></div><label>Opis / uwagi<textarea id="rulerNotes" rows="3"></textarea></label><div class="dialog-actions"><button value="cancel">Anuluj</button><button id="saveRulerBtn" class="primary" value="default">Dodaj</button></div></form></dialog>
<dialog id="editRulerDialog"><form method="dialog" id="editRulerForm"><h2>Edytuj władcę / osobę sprawującą władzę</h2><label>Państwo<select id="editRulerCountry" required></select></label><label>Imię i nazwisko<input id="editRulerName" required></label><label>Funkcja / rola<input id="editRulerRole"></label><label>Poziom władzy<select id="editRulerLevel"><option value="1">1 — najwyższy</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label><div class="date-grid"><label>Od<input id="editRulerStart" required></label><label>Do<input id="editRulerEnd" placeholder="puste = dziś"></label></div><label>Opis / uwagi<textarea id="editRulerNotes" rows="3"></textarea></label><div class="dialog-actions"><button value="cancel" id="cancelEditRulerBtn">Anuluj</button><button id="saveEditRulerBtn" class="primary" value="default">Zapisz zmiany</button></div></form></dialog><dialog id="settingsDialog"><form method="dialog" id="settingsForm"><h2>Ustawienia danych</h2><p class="muted">Możesz później podłączyć publiczny CSV z Google Sheets.</p><label>Adres arkusza Google Sheets<input id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/.../edit?usp=sharing"></label><label>Adres Google Apps Script do zapisu<input id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec"></label><label class="check"><input type="checkbox" id="showGrid" checked> Pokaż siatkę lat</label><div class="dialog-actions"><button value="cancel">Zamknij</button><button id="reloadSheetBtn" class="primary" value="default">Wczytaj dane</button></div></form></dialog>
<script src="app.js"></script></body></html>
